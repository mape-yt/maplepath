<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaplePath Dashboard</title>

    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>


<body>


<div class="container">


    <div id="sidebar-container"></div>


    <main class="main-content">


        <header class="dashboard-header">


            <div>

                <h1 id="welcome-title">
                    Welcome Back!
                </h1>


                <p>
                    Track your journey toward Canadian Permanent Residency.
                </p>


            </div>



            <div class="header-actions">


                <div class="avatar">

                    👤

                </div>



                <button id="logout-btn">

                    Logout

                </button>


            </div>


        </header>





        <section class="cards">


            <!-- Progress Card -->

            <div class="card progress-card">


                <h2>Immigration Progress</h2>


                <div class="progress-bar">

                    <div class="progress-fill" id="progress-fill"></div>

                </div>


                <h3 id="progress-percent">
                    0%
                </h3>


                <p>
                    Your immigration journey progress.
                </p>


            </div>





            <!-- Next Step Card -->


            <div class="card next-step-card">


                <h2>
                    Next Recommended Step
                </h2>


                <h3 id="next-step-title">

                    Loading...

                </h3>


                <p id="next-step-description">

                    Checking your immigration pathway...

                </p>


            </div>







            <!-- Profile Snapshot -->

            <div class="card profile-card">


                <h2>
                    👤 Profile Snapshot
                </h2>



                <div id="profile-snapshot">


                    Loading...


                </div>



                <button
                    id="view-profile-btn"
                    class="view-btn"
                >

                    View Full Profile →

                </button>


            </div>




        </section>






        <section class="tasks">


            <h2>
                Upcoming Tasks
            </h2>



            <div class="task-input">


                <input
                    type="text"
                    id="new-task"
                    placeholder="Enter a new immigration task"
                >


                <button id="add-task-btn">

                    Add Task

                </button>


            </div>




            <ul id="task-list">


            </ul>



        </section>




    </main>



</div>




<script src="js/layout.js"></script>
<script src="js/session.js"></script>
<script src="js/dashboard.js"></script>


</body>


</html>
