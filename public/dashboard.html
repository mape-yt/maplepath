<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaplePath Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <h2>🍁 MaplePath</h2>

        <nav>

            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Tasks</a>
            <a href="#">Updates</a>
            <a href="#">Settings</a>

        </nav>

    </aside>

    <main class="main-content">

        <header>

            <h1>Welcome Back!</h1>
            <p>Let's continue your immigration journey.</p>

        </header>

        <section class="cards">

            <div class="card">
                <h3>Progress</h3>
                <p>0%</p>
            </div>

            <div class="card">
                <h3>Latest Updates</h3>
                <p>No updates yet.</p>
            </div>

        </section>

        <section class="tasks">

            <h2>Upcoming Tasks</h2>

            <ul>

                <li>Create your immigration profile</li>
                <li>Upload required documents</li>
                <li>Complete language test</li>

            </ul>

        </section>

    </main>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
