<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaplePath Journey</title>

    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/journey.css">

</head>

<body>

<div class="container">

    <div id="sidebar-container"></div>

    <main class="main-content">

        <!-- ==========================
             Page Header
        =========================== -->

        <header class="dashboard-header">

            <div>

                <h1>
                    🧭 My Immigration Journey
                </h1>

                <p>
                    Track your complete immigration journey from start to permanent residence.
                </p>

            </div>

        </header>


        <!-- ==========================
             Journey Summary
        =========================== -->

        <section id="journey-summary">

            <!-- Filled by JavaScript -->

        </section>


        <!-- ==========================
             Journey Timeline
        =========================== -->

        <section id="journey-container">

            <div class="loading">

                Loading your immigration journey...

            </div>

        </section>

        <p id="journey-notice" class="journey-notice" role="status" hidden></p>


    </main>

</div>


<dialog id="timeline-edit-dialog" class="timeline-edit-dialog" aria-labelledby="timeline-edit-title">
    <form id="timeline-edit-form">
        <h2 id="timeline-edit-title">Edit timeline dates</h2>
        <p id="timeline-edit-step"></p>

        <label for="timeline-start-date">Start date</label>
        <input id="timeline-start-date" name="startedAt" type="date" required>

        <div id="timeline-finish-field">
            <label for="timeline-finish-date">Finish date</label>
            <input id="timeline-finish-date" name="completedAt" type="date">
        </div>

        <p id="timeline-edit-error" class="timeline-edit-error" role="alert" hidden></p>

        <div class="timeline-edit-actions">
            <button type="button" id="timeline-edit-cancel" class="edit-timeline-btn">Cancel</button>
            <button type="submit" id="timeline-edit-save" class="complete-btn">Save dates</button>
        </div>
    </form>
</dialog>

<script src="js/layout.js"></script>
<script src="js/session.js"></script>
<script src="js/journey.js"></script>

</body>

</html>
