<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        MaplePath Journey
    </title>


    <link rel="stylesheet" href="css/layout.css">

    <link rel="stylesheet" href="css/sidebar.css">

    <link rel="stylesheet" href="css/journey.css">


</head>


<body>


<div class="container">


    <div id="sidebar-container"></div>



    <main class="main-content">


        <header class="dashboard-header">


            <div>


                <h1>
                    🧭 My Immigration Journey
                </h1>


                <p>
                    Follow your personalized path toward Canadian Permanent Residency.
                </p>


            </div>


        </header>





        <section id="journey-container">


            Loading your immigration journey...


        </section>



    </main>



</div>


<!-- Timeline Edit Modal -->

<div id="timeline-modal" class="modal hidden">


    <div class="modal-card">


        <h2>
            ✏️ Edit Timeline Dates
        </h2>



        <label>
            Start Date
        </label>

        <input 
            type="date"
            id="edit-start-date"
        >



        <label>
            Completion Date
        </label>

        <input 
            type="date"
            id="edit-end-date"
        >



        <div class="duration-preview">


            Duration:

            <strong id="edit-duration">
                0 days
            </strong>


        </div>




        <div class="modal-buttons">


            <button 
                id="cancel-edit"
                class="cancel-btn"
            >

                Cancel

            </button>




            <button 
                id="save-edit"
                class="save-btn"
            >

                Save

            </button>



        </div>



    </div>


</div>


<script src="js/layout.js"></script>

<script src="js/journey.js"></script>


</body>


</html>
