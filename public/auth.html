<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaplePath | Sign In</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="container">
    <h1 class="logo">🍁 MaplePath</h1>

    <nav>
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="auth.html" class="nav-link btn-primary">Sign Up / Login</a>
    </nav>
  </div>
</header>

<section class="auth-section">

  <div class="container auth-container">

    <h2>Welcome to MaplePath</h2>

    <p>
      Track your Canadian immigration journey with confidence.
    </p>

    <div class="tabs">

      <button id="signup-tab" class="tab-btn active">
        Sign Up
      </button>

      <button id="login-tab" class="tab-btn">
        Login
      </button>

    </div>

    <!-- SIGNUP -->

    <form id="signup-form" class="auth-form">

      <h3>Create an Account</h3>

      <label>Username</label>

      <input
        id="signup-username"
        type="text"
        required
      >

      <label>Password</label>

      <input
        id="signup-password"
        type="password"
        required
      >

      <button class="btn-primary" type="submit">
        Sign Up
      </button>

      <p id="signup-message"></p>

    </form>

    <!-- LOGIN -->

    <form id="login-form" class="auth-form hidden">

      <h3>Login</h3>

      <label>Username</label>

      <input
        id="login-username"
        type="text"
        required
      >

      <label>Password</label>

      <input
        id="login-password"
        type="password"
        required
      >

      <button class="btn-primary" type="submit">
        Login
      </button>

      <p id="login-message"></p>

    </form>

  </div>

</section>

<footer class="footer">

  <div class="container">

    <p>

      © 2026 MaplePath |
      <a href="aboutdev.html">
        About the Developer
      </a>

    </p>

  </div>

</footer>

<script src="js/auth.js"></script>

</body>
</html>
