<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaplePath Onboarding</title>

</head>


<body>


    <h1>Welcome to MaplePath 🍁</h1>

    <p>
        Let's personalize your Canadian immigration journey.
    </p>


    <form id="onboardingForm">


        <label>
            Immigration Pathway
        </label>

        <br>

        <select id="pathway">

            <option value="Express Entry">
                Express Entry
            </option>

            <option value="Provincial Nominee Program">
                Provincial Nominee Program
            </option>

            <option value="Atlantic Immigration Program">
                Atlantic Immigration Program
            </option>

            <option value="Family Sponsorship">
                Family Sponsorship
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <br><br>



        <label>
            Province
        </label>

        <br>

        <select id="province">

            <option value="Alberta">
                Alberta
            </option>

            <option value="Ontario">
                Ontario
            </option>

            <option value="British Columbia">
                British Columbia
            </option>

            <option value="Manitoba">
                Manitoba
            </option>

            <option value="Not decided">
                Not decided
            </option>

        </select>


        <br><br>



        <label>
            Current Location
        </label>

        <br>

        <select id="location">

            <option value="Inside Canada">
                Inside Canada
            </option>

            <option value="Outside Canada">
                Outside Canada
            </option>

        </select>


        <br><br>



        <label>
            Immigration Status
        </label>

        <br>

        <select id="status">

            <option value="Planning">
                Planning
            </option>

            <option value="Preparing application">
                Preparing application
            </option>

            <option value="Submitted application">
                Submitted application
            </option>

            <option value="Waiting for decision">
                Waiting for decision
            </option>

        </select>


        <br><br>



        <label>
            Current Stage
        </label>

        <br>

        <select id="currentStage">

            <option value="Researching">
                Researching
            </option>

            <option value="Collecting documents">
                Collecting documents
            </option>

            <option value="Improving eligibility">
                Improving eligibility
            </option>

            <option value="Submitted">
                Submitted
            </option>

        </select>


        <br><br>



        <label>
            Journey Start Date
        </label>

        <br>

        <input 
            type="date"
            id="journeyStartDate"
        >


        <br><br>



        <button type="submit">
            Continue
        </button>


    </form>



    <script src="js/onboarding.js"></script>


</body>

</html>
